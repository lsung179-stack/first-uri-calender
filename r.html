<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#f3e6cf">
<title>우리 캘린더 · 방 초대</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="우리 캘린더">
<meta property="og:title" content="우리 캘린더 · 방 초대">
<meta property="og:description" content="함께 일정을 나누는 공간으로 초대해요">
<meta property="og:image" content="https://first-uri-calender.vercel.app/icon-512.png">
<meta property="og:locale" content="ko_KR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f3e6cf;--paper:#fbf3e2;--ink:#2a1c0f;--terra:#8b3a2a;--terra-deep:#6e2c1f;--gold:#c9a04e;--muted:#8a6c52;--line:rgba(139,58,42,.22);--shadow:rgba(60,35,15,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:only light !important;forced-color-adjust:none !important}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;color-scheme:only light !important;forced-color-adjust:none !important;-webkit-font-smoothing:antialiased}
.stamp{width:88px;height:88px;border:2.5px solid var(--terra);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--paper);margin-bottom:22px;box-shadow:0 6px 18px var(--shadow)}
.stamp::before{content:'';position:absolute;inset:6px;border:1px solid var(--terra);border-radius:50%}
.stamp .o{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--terra);line-height:1;letter-spacing:1px}
.stamp .c{font-family:'Playfair Display',serif;font-size:7px;font-weight:700;color:var(--terra);letter-spacing:1.5px;margin-top:3px}
.title{font-family:'Hahmlet','Gowun Batang',serif;font-weight:700;font-size:20px;color:var(--ink);margin-bottom:6px;letter-spacing:-.3px}
.title .rn{color:var(--terra)}
.sub{font-size:13px;color:var(--muted);margin-bottom:26px}
.open-app-btn{display:none;align-items:center;justify-content:center;gap:9px;width:100%;max-width:300px;margin:0 auto 12px;padding:15px 20px;border:none;border-radius:14px;background:var(--terra);color:var(--paper);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px var(--shadow);letter-spacing:.2px;transition:transform .15s}
.open-app-btn.on{display:inline-flex}
.open-app-btn:active{transform:scale(.98)}
.open-app-btn svg{width:20px;height:20px;flex:none}
.app-hint{display:none;font-size:12.5px;color:var(--terra);font-weight:600;line-height:1.6;margin:0 auto 18px}
.app-hint.on{display:block}
.or-line{font-size:11.5px;color:#b39b7c;letter-spacing:1px;margin:4px 0 22px}
.step{font-family:'Hahmlet','Gowun Batang',serif;font-weight:700;font-size:17px;color:var(--terra);margin-bottom:14px}
.code-box{display:inline-flex;align-items:center;gap:12px;background:#fff7e8;border:2px solid var(--gold);border-radius:14px;padding:15px 24px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px var(--shadow);margin-bottom:8px}
.code-box:active{transform:scale(.97)}
.code-box .hash{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);font-weight:600}
.code-box .code{font-family:'Playfair Display',serif;font-size:23px;font-weight:600;letter-spacing:2px;color:var(--ink)}
.code-box .cp{width:21px;height:21px;color:var(--terra)}
.copied{font-size:12.5px;color:var(--terra);font-weight:700;height:18px;margin-bottom:30px;opacity:0;transition:opacity .2s}
.copied.on{opacity:1}
.step2{font-family:'Hahmlet','Gowun Batang',serif;font-weight:700;font-size:17px;color:var(--ink);margin-bottom:18px}
.badges{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin:0 auto}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:11px;background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:13px;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 16px var(--shadow);text-decoration:none}
.badge:active{transform:scale(.98)}
.badge svg{width:26px;height:26px;flex:none}
.badge .bt{display:flex;flex-direction:column;line-height:1.18;text-align:left}
.badge .bt small{font-size:10px;opacity:.78}
.badge .bt span{font-size:16px;font-weight:700}
.open-app{margin-top:22px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:40px;font-size:11px;color:#b39b7c;line-height:1.6}
.foot a{color:var(--terra)}
</style>
</head>
<body>
<div class="stamp"><span class="o">OUR</span><span class="c">CALENDAR</span></div>
<div class="title" id="title">우리 캘린더에 초대받았어요</div>
<div class="sub">함께 일정을 나누는 공간으로의 초대예요</div>
<button class="open-app-btn" id="openAppBtn" onclick="openApp()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  앱으로 바로 열기
</button>
<div class="app-hint" id="appHint">앱이 아직 없어요? 코드를 복사해뒀으니<br>아래에서 설치 후 붙여넣어 주세요 👇</div>
<div class="or-line" id="orLine">─── 앱이 없다면 ───</div>
<div class="step">초대 코드를 복사하고</div>
<div class="code-box" id="codeBox" onclick="copyCode()">
  <span class="hash">#</span>
  <span class="code" id="codeText">------</span>
  <svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
</div>
<div class="copied" id="copied">코드를 복사했어요!</div>
<div class="step2">앱 설치 후 입력해주세요</div>
<div class="badges">
  <a class="badge" href="https://apps.apple.com/app/id6773996160" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" style="transform:scale(1.18)"><path d="M16.36 12.78c.02-2.06 1.68-3.05 1.76-3.1-0.96-1.4-2.45-1.6-2.98-1.62-1.27-.13-2.48.75-3.12.75-.64 0-1.64-.73-2.7-.71-1.39.02-2.67.81-3.38 2.05-1.44 2.5-.37 6.2 1.04 8.23.69 1 1.5 2.11 2.57 2.07 1.03-.04 1.42-.67 2.67-.67 1.24 0 1.6.67 2.69.65 1.11-.02 1.81-1.01 2.49-2.01.78-1.15 1.1-2.27 1.12-2.33-.02-.01-2.15-.83-2.17-3.27zM14.3 6.74c.57-.69.95-1.65.85-2.6-.82.03-1.81.54-2.39 1.23-.52.61-.98 1.59-.86 2.52.91.07 1.84-.46 2.4-1.15z"/></svg>
    <span class="bt"><small>다운로드</small><span>App Store</span></span>
  </a>
  <a class="badge" href="https://play.google.com/store/apps/details?id=app.vercel.first_uri_calender.twa" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path fill="#34A853" d="M3.6 21.2 13 12.4 15.6 15 5.2 21.4c-.6.3-1.2.1-1.6-.2z"/><path fill="#EA4335" d="M3.6 2.8c0-.3.4-.5.9-.5l11.1 6.4-2.6 2.5z"/><path fill="#FBBC04" d="m16.9 9.1 3.4 1.9c.9.5.9 1.5 0 2L16.8 15 14 12z"/><path fill="#4285F4" d="M3.6 2.8 13 11.6 3.6 21.2c-.1-.2-.1-.4-.1-.6V3.4c0-.2 0-.4.1-.6z"/></svg>
    <span class="bt"><small>다운로드</small><span>Google Play</span></span>
  </a>
</div>
<div class="foot">우리 캘린더 · 함께 쓰는 우리들의 캘린더<br>문의 : <a href="mailto:lsung179@naver.com">lsung179@naver.com</a></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var code = (params.get('join') || params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(code){
    document.getElementById('codeText').textContent = code;
  } else {
    document.getElementById('codeText').textContent = '코드없음';
    document.getElementById('orLine').style.display = 'none';
  }
  window._code = code;

  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua);
  window._isAndroid = isAndroid;

  // 모바일 + 코드 있음 → '앱으로 바로 열기' 노출 (앱 설치자는 탭 한 번에 입장)
  if(code && (isAndroid || isIOS)){
    document.getElementById('openAppBtn').classList.add('on');
  } else {
    document.getElementById('orLine').style.display = 'none';
  }

  // 방 이름 조회 — 익명 RPC(lookup_room_by_code). 실패해도 기본 문구 유지.
  if(code){
    var SUPA = 'https://bgqzkkaslqchbovzrkao.supabase.co';
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJncXpra2FzbHFjaGJvdnpya2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzA5ODMsImV4cCI6MjA5MzYwNjk4M30.UkVo7bugGodTB1hxkQNltFqv1GrMTaNhJ8Lhmo3pIHc';
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    if(ctl) setTimeout(function(){ try{ctl.abort()}catch(e){} }, 3500);
    fetch(SUPA + '/rest/v1/rpc/lookup_room_by_code', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ invite_code: code }),
      signal: ctl ? ctl.signal : undefined
    }).then(function(r){ return r.ok ? r.json() : null; }).then(function(rows){
      var room = rows && rows.length ? rows[0] : null;
      if(!room || !room.name) return;
      // textContent로만 조립 (방 이름은 사용자 입력값 — HTML 삽입 금지)
      var t = document.getElementById('title');
      t.textContent = '';
      var rn = document.createElement('span');
      rn.className = 'rn';
      rn.textContent = '‘' + room.name + '’';
      t.appendChild(rn);
      t.appendChild(document.createTextNode('에 초대받았어요'));
    }).catch(function(){});
  }

  // 카톡·인스타 등 Android 인앱브라우저 → 자동으로 앱 열기 시도 (세션당 1회, 실패 시 이 페이지 유지)
  try{
    var inApp = /kakaotalk|naver\(inapp|fb_iab|fban|fbav|instagram|line\//i.test(ua);
    if(code && isAndroid && inApp && !params.get('noauto') && !sessionStorage.getItem('r.autoOpen')){
      sessionStorage.setItem('r.autoOpen', '1');
      setTimeout(function(){ try{ location.href = androidIntentUrl(); }catch(e){} }, 250);
    }
  }catch(e){}
})();
function androidIntentUrl(){
  var host = 'first-uri-calender.vercel.app';
  var fallback = encodeURIComponent('https://' + host + '/r.html?join=' + window._code + '&noauto=1');
  return 'intent://' + host + '/?join=' + window._code
    + '#Intent;scheme=https;package=app.vercel.first_uri_calender.twa'
    + ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE'
    + ';S.browser_fallback_url=' + fallback + ';end';
}
function openApp(){
  var code = window._code; if(!code) return;
  // 앱 전환 전에 코드를 미리 복사 — 미설치자가 설치 후 '붙여넣기'로 이어가도록 (사실상 deferred deep link)
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).catch(function(){}); }catch(e){}
  setTimeout(function(){
    // 1.6초 뒤에도 이 페이지가 보이면 앱 전환 실패로 간주 → 설치 안내
    if(!document.hidden) document.getElementById('appHint').classList.add('on');
  }, 1600);
  if(window._isAndroid){ location.href = androidIntentUrl(); }
  else { location.href = 'com.lsung.uricalendar://join?code=' + code; }
}
function copyCode(){
  var code = window._code; if(!code) return;
  var done = function(){ var el=document.getElementById('copied'); el.classList.add('on'); setTimeout(function(){el.classList.remove('on');},2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(function(){ fallbackCopy(code); done(); });
  } else { fallbackCopy(code); done(); }
}
function fallbackCopy(text){
  try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
}
</script>
</body>
</html>
