workflows:

  ios-compile-check:
    name: iOS compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Ensure @capacitor/preferences (위젯 데이터 브릿지)
        script: |
          node -e "require('@capacitor/preferences/package.json')" 2>/dev/null \
            && echo "✅ @capacitor/preferences 이미 설치됨" \
            || npm install @capacitor/preferences
      - name: Generate iOS platform fresh (CocoaPods)
        script: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: Add home screen widget target (WidgetKit 주입)
        script: |
          set -e
          # 위젯 파일이 없으면 위젯 없이 계속 (앱 repo의 widget/ 폴더를 이 빌드 repo 루트로 복사하면 활성화)
          if [ ! -f widget/ios/add_widget_target.rb ]; then
            echo "⚠️ widget/ios 없음 — 위젯 스킵"
            exit 0
          fi
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby widget/ios/add_widget_target.rb ios/App/App.xcodeproj ZZ9B9BWM8T
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          grep -q "com.lsung.uricalendar.widget" "$PROJ" && echo "✅ 위젯 타깃 주입 확인" || (echo "❌ 주입 실패"; exit 1)
      - name: Install CocoaPods (creates App.xcworkspace)
        script: |
          cd ios/App
          pod install
      - name: Build without code signing
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS signed build to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: uricalendar_asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - uricalendar_profile
          - uricalendar_widget_profile   # 위젯용 — Codemagic에 이 참조명으로 등록 필요 (README 체크리스트)
        certificates:
          - uricalendar_dist
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Ensure @capacitor/preferences (위젯 데이터 브릿지)
        script: |
          node -e "require('@capacitor/preferences/package.json')" 2>/dev/null \
            && echo "✅ @capacitor/preferences 이미 설치됨" \
            || npm install @capacitor/preferences
      - name: Generate iOS platform fresh (CocoaPods)
        script: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: Force correct bundle ID + team (com.lsung.uricalendar)
        script: |
          set -e
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.lsung.uricalendar;/g' "$PROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = ZZ9B9BWM8T;/g' "$PROJ"
          echo "Forced ->"
          grep -m1 "PRODUCT_BUNDLE_IDENTIFIER" "$PROJ"
          grep -m1 "DEVELOPMENT_TEAM" "$PROJ" || echo "(DEVELOPMENT_TEAM not present yet; use-profiles will inject)"
      - name: Generate app icon + splash (from assets/)
        script: |
          npx --yes @capacitor/assets generate --ios
      - name: Set version (package.json) + build number (auto-increment)
        script: |
          set -e
          # 마케팅 버전(CFBundleShortVersionString): App Store Connect에 이미 올라간 버전보다
          # 반드시 '높아야' 업로드된다. (다음에 또 올릴 땐 이 줄의 숫자만 1.1.4 / 1.2.0 등으로 올리면 됨)
          APP_VERSION="1.1.3"
          echo "Marketing version = $APP_VERSION"
          # 빌드 번호: TestFlight 최신 빌드 +1 (중복 방지)
          LATEST=$(app-store-connect get-latest-testflight-build-number 6773996160 2>/dev/null || echo 0)
          NEXT=$(( LATEST + 1 ))
          if [ "$NEXT" -lt 27 ]; then NEXT=27; fi
          echo "Latest TestFlight build = $LATEST, setting this build to $NEXT (min 27)"
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9.]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$PROJ"
          sed -i '' "s/MARKETING_VERSION = [0-9][0-9.]*;/MARKETING_VERSION = $APP_VERSION;/g" "$PROJ"
          echo "Applied ->"
          grep -m1 "MARKETING_VERSION" "$PROJ"
          grep -m1 "CURRENT_PROJECT_VERSION" "$PROJ"
      - name: Set export compliance (skip encryption prompt)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "ITSAppUsesNonExemptEncryption set to NO"
      - name: Set iPhone Only (no iPad support)
        script: |
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PROJ"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1,2;/TARGETED_DEVICE_FAMILY = 1;/g' "$PROJ"
          echo "Set TARGETED_DEVICE_FAMILY to 1 (iPhone only)"
          grep "TARGETED_DEVICE_FAMILY" "$PROJ" || true
      - name: Set Korean as primary localization + permission descriptions
        script: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleDevelopmentRegion ko" "$PLIST" 2>/dev/null || $PB -c "Add :CFBundleDevelopmentRegion string ko" "$PLIST"
          $PB -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null
          $PB -c "Add :CFBundleLocalizations array" "$PLIST"
          $PB -c "Add :CFBundleLocalizations:0 string ko" "$PLIST"
          # 사진 라이브러리 권한 설명문 (구체적 예시 포함)
          PHOTO_DESC='프로필 사진과 일정 첨부 사진을 사진 보관함에서 선택할 수 있도록 접근합니다. 예: 프로필 설정 화면에서 사진 보관함의 사진을 선택해 본인 프로필 사진으로 등록할 수 있습니다.'
          $PB -c "Set :NSPhotoLibraryUsageDescription '$PHOTO_DESC'" "$PLIST" 2>/dev/null || $PB -c "Add :NSPhotoLibraryUsageDescription string '$PHOTO_DESC'" "$PLIST"
          # 카메라 권한 설명문 (구체적 예시 포함)
          CAM_DESC='프로필 사진과 일정 첨부 사진을 직접 촬영할 수 있도록 카메라에 접근합니다. 예: 프로필 설정 화면에서 카메라로 촬영하여 본인 프로필 사진으로 등록할 수 있습니다.'
          $PB -c "Set :NSCameraUsageDescription '$CAM_DESC'" "$PLIST" 2>/dev/null || $PB -c "Add :NSCameraUsageDescription string '$CAM_DESC'" "$PLIST"
          # AdMob App ID (필수 — 없으면 앱 크래시)
          $PB -c "Set :GADApplicationIdentifier 'ca-app-pub-2305246987819297~4146324211'" "$PLIST" 2>/dev/null || $PB -c "Add :GADApplicationIdentifier string 'ca-app-pub-2305246987819297~4146324211'" "$PLIST"
          # ATT 광고 추적 권한 설명문
          $PB -c "Set :NSUserTrackingUsageDescription '더 나은 광고 경험을 위해 사용됩니다.'" "$PLIST" 2>/dev/null || $PB -c "Add :NSUserTrackingUsageDescription string '더 나은 광고 경험을 위해 사용됩니다.'" "$PLIST"
          # SKAdNetwork (AdMob 필수)
          $PB -c "Add :SKAdNetworkItems array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :SKAdNetworkItems:0 dict" "$PLIST" 2>/dev/null || true
          $PB -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string 'cstr6suwn9.skadnetwork'" "$PLIST" 2>/dev/null || true
          echo "Korean localization, permission descriptions and AdMob settings applied"
      - name: Register custom URL scheme (deep link for OAuth callback)
        script: |
          PLIST=ios/App/App/Info.plist
          SCHEME=com.lsung.uricalendar
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string $SCHEME" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST" 2>/dev/null || true
          echo "Registered URL scheme: $SCHEME://"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" || true
      - name: Add Sign in with Apple entitlement
        script: |
          ENTITLEMENTS="ios/App/App/App.entitlements"
          cat > "$ENTITLEMENTS" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
          echo "Created App.entitlements with Sign in with Apple capability"
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PROJ"; then
            awk '/PRODUCT_BUNDLE_IDENTIFIER = com.lsung.uricalendar;/ { print "\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;"; print; next } { print }' "$PROJ" > "$PROJ.tmp" && mv "$PROJ.tmp" "$PROJ"
            echo "Added CODE_SIGN_ENTITLEMENTS to project.pbxproj"
          else
            echo "CODE_SIGN_ENTITLEMENTS already exists"
          fi
          grep -A1 "CODE_SIGN_ENTITLEMENTS" "$PROJ" | head -10 || true
      - name: Add home screen widget target (WidgetKit 주입)
        script: |
          set -e
          # 위젯 파일이 없으면 위젯 없이 계속 (앱 repo의 widget/ 폴더를 이 빌드 repo 루트로 복사하면 활성화)
          if [ ! -f widget/ios/add_widget_target.rb ]; then
            echo "⚠️ widget/ios 없음 — 위젯 스킵"
            exit 0
          fi
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby widget/ios/add_widget_target.rb ios/App/App.xcodeproj ZZ9B9BWM8T
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          grep -q "com.lsung.uricalendar.widget" "$PROJ" && echo "✅ 위젯 타깃 주입 확인" || (echo "❌ 주입 실패"; exit 1)
      - name: Install CocoaPods (creates App.xcworkspace)
        script: |
          cd ios/App
          pod install
      - name: Set up code signing (apply registered profile)
        script: |
          xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-aab:
    name: Android signed AAB (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      groups:
        - android_signing
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
          echo ""
          echo "=== [진단] @capacitor/app 플러그인 설치 여부 (뒤로가기 버튼 필수) ==="
          if [ -d "node_modules/@capacitor/app" ]; then
            V=$(node -e "console.log(require('./node_modules/@capacitor/app/package.json').version)" 2>/dev/null)
            echo "✅ @capacitor/app 설치됨 (버전: $V)"
          else
            echo "❌ @capacitor/app 미설치! 하단 뒤로가기 버튼(App.addListener backButton)이 동작하지 않음."
            echo "   → package.json dependencies에 '@capacitor/app'을 추가하고 npm install 필요"
          fi
      - name: Generate Android platform fresh
        script: |
          rm -rf android
          npx cap add android
          npx cap sync android
          echo ""
          echo "=== [진단] @capacitor/app 네이티브 등록 확인 (capacitor.build.gradle) ==="
          BG="android/app/capacitor.build.gradle"
          if [ -f "$BG" ] && grep -q "capacitor-app" "$BG"; then
            echo "✅ capacitor-app 네이티브 모듈이 Android 프로젝트에 등록됨"
          else
            echo "❌ capacitor-app이 $BG 에 없음 — App 플러그인이 네이티브에 연결 안 됨 (뒤로가기 버튼 원인 가능)"
            echo "--- $BG 내용 ---"
            cat "$BG" 2>/dev/null || echo "(파일 없음)"
          fi
          echo ""
          echo "=== [진단] @revenuecat/purchases-capacitor 네이티브 등록 확인 (Play Store 결제) ==="
          if [ -f "$BG" ] && grep -qi "purchases-capacitor" "$BG"; then
            echo "✅ purchases-capacitor 네이티브 모듈이 Android 프로젝트에 등록됨"
          else
            echo "❌ purchases-capacitor이 $BG 에 없음 — package.json엔 있는데 Android 네이티브 연결이 안 됨"
            echo "--- $BG 내용 ---"
            cat "$BG" 2>/dev/null || echo "(파일 없음)"
          fi
      - name: FCM google-services 배치 + 플러그인 적용 (네이티브 푸시 필수)
        script: |
          set -e
          # google-services.json 은 이 repo 루트에 커밋되어 있어야 함 (Firebase 콘솔에서 받은 파일)
          if [ ! -f google-services.json ]; then
            echo "❌ google-services.json 이 repo 루트에 없음 — Firebase 콘솔에서 받아 커밋하세요 (패키지명: app.vercel.first_uri_calender.twa)"
            exit 1
          fi
          cp google-services.json android/app/google-services.json
          echo "✅ google-services.json → android/app/ 복사 완료"
          # 1) 루트 build.gradle 의 buildscript dependencies 에 google-services classpath 주입
          ROOT="android/build.gradle"
          if ! grep -q "com.google.gms:google-services" "$ROOT"; then
            perl -0pi -e 's#(dependencies\s*\{)#$1\n        classpath "com.google.gms:google-services:4.4.2"#' "$ROOT"
            echo "✅ google-services classpath 주입"
          fi
          # 2) app build.gradle 맨 아래에 플러그인 적용
          APP="android/app/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$APP"; then
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP"
            echo "✅ google-services 플러그인 적용"
          fi
          echo "=== [진단] @capacitor/push-notifications 네이티브 등록 확인 ==="
          BG="android/app/capacitor.build.gradle"
          if grep -q "push-notifications" "$BG" 2>/dev/null; then
            echo "✅ push-notifications 네이티브 모듈이 Android 프로젝트에 등록됨"
          else
            echo "❌ push-notifications 미등록 — package.json 에 @capacitor/push-notifications 추가 후 npm install/cap sync 필요"
            cat "$BG" 2>/dev/null || true
          fi
      - name: Force applicationId + version (Play Store 교체 핵심)
        script: |
          set -e
          GRADLE="android/app/build.gradle"
          sed -i '' 's/applicationId "com.lsung.uricalendar"/applicationId "app.vercel.first_uri_calender.twa"/' "$GRADLE"
          VC="${ANDROID_VERSION_CODE:-27}"
          VN="${ANDROID_VERSION_NAME:-1.1.3}"
          sed -i '' "s/versionCode [0-9]*/versionCode $VC/" "$GRADLE"
          sed -i '' "s/versionName \"[^\"]*\"/versionName \"$VN\"/" "$GRADLE"
          echo "=== build.gradle (defaultConfig) ==="
          grep -E "applicationId|versionCode|versionName" "$GRADLE"
      - name: Inject AdMob App ID into AndroidManifest
        script: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            perl -0pi -e 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2305246987819297~5315935656"/>\n    </application>#' "$MANIFEST"
            echo "AdMob App ID 주입 완료"
          else
            echo "AdMob App ID 이미 존재 — skip"
          fi
          # AD_ID 권한 — Ads SDK가 머지 단계에서 tools:node="remove"로 빼므로 replace로 강제 (핵심)
          # 1) tools 네임스페이스 보장 (없으면 replace 지시가 무효)
          if ! grep -q 'xmlns:tools' "$MANIFEST"; then
            perl -0pi -e 's#(<manifest\b)#$1 xmlns:tools="http://schemas.android.com/tools"#' "$MANIFEST"
            echo "xmlns:tools 네임스페이스 추가"
          fi
          # 2) 기존 AD_ID uses-permission 라인은 형태 불문 전부 제거 (remove 지시 포함 라인까지)
          perl -0pi -e 's#[ \t]*<uses-permission[^>]*android:name="com\.google\.android\.gms\.permission\.AD_ID"[^>]*/>[ \t]*\n?##g' "$MANIFEST"
          # 3) tools:node="replace"와 함께 재주입 → 최종 머지에서 SDK의 remove를 이김
          perl -0pi -e 's#(<manifest\b[^>]*>)#$1\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="replace"/>#' "$MANIFEST"
          echo "AD_ID 권한 주입 완료 (tools:node=replace)"
          echo "=== Manifest 전체 구조 확인 (디버그) ==="
          head -20 "$MANIFEST"
          echo "=== AD_ID 위치 확인 ==="
          grep -n "AD_ID\|<manifest\|<application\|</application>" "$MANIFEST" || echo "(주입 실패)"
      - name: Register OAuth deep link scheme (카카오 로그인 콜백)
        script: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          SCHEME="com.lsung.uricalendar"
          HOST="login-callback"
          # MainActivity에 커스텀 스킴 인텐트 필터가 없으면 </activity> 앞에 주입
          if ! grep -q "android:scheme=\"$SCHEME\"" "$MANIFEST"; then
            perl -0pi -e 's#(\s*)</activity>#$1    <intent-filter>\n$1        <action android:name="android.intent.action.VIEW" />\n$1        <category android:name="android.intent.category.DEFAULT" />\n$1        <category android:name="android.intent.category.BROWSABLE" />\n$1        <data android:scheme="'"$SCHEME"'" android:host="'"$HOST"'" />\n$1    </intent-filter>\n$1</activity>#' "$MANIFEST"
            echo "딥링크 스킴 주입 완료: $SCHEME://$HOST"
          else
            echo "딥링크 스킴 이미 존재 — skip"
          fi
          echo "=== MainActivity 인텐트 필터 확인 ==="
          grep -A2 "android:scheme=\"$SCHEME\"" "$MANIFEST" || echo "(주입 실패 — Manifest 구조 확인 필요)"
      - name: Disable force-dark (galaxy 다크모드 픽스)
        script: |
          set -e
          STYLES="android/app/src/main/res/values/styles.xml"
          # DayNight 테마 → Light 고정 (시스템 다크 추종 차단)
          sed -i '' 's#Theme.AppCompat.DayNight.NoActionBar#Theme.AppCompat.Light.NoActionBar#' "$STYLES"
          # AppTheme.NoActionBar 에 forceDarkAllowed=false 주입 (WebView 강제 다크 차단)
          perl -0pi -e 's#(<style name="AppTheme.NoActionBar"[^>]*>)#$1\n        <item name="android:forceDarkAllowed">false</item>#' "$STYLES"
          echo "=== styles.xml (다크 픽스 적용) ==="
          cat "$STYLES"
      - name: Force light mode in MainActivity (다크모드 완전 차단 — 전 안드로이드 버전)
        script: |
          set -e
          # ★ 갤럭시 다크모드 핵심 픽스.
          #   위 styles.xml 픽스(forceDarkAllowed)는 Android 12 이하에서만 유효하고,
          #   Android 13+ (One UI 5/6/7)는 'Algorithmic Darkening'이라는 새 방식을 쓰며
          #   forceDarkAllowed를 무시한다 → 13+ 갤럭시에서만 다크모드가 뚫리던 원인.
          #   MainActivity에서 3중 차단:
          #     1) setDefaultNightMode(MODE_NIGHT_NO): 시스템 설정 무관 앱 전체 라이트 고정
          #        (스플래시 DayNight 테마 포함 — WebView 생성 시점의 '앱=다크' 판정 자체를 제거)
          #     2) API 33+: setAlgorithmicDarkeningAllowed(false) — Android 13+ 자동 다크 차단
          #     3) API 29~32: setForceDark(FORCE_DARK_OFF) — Android 10~12 강제 다크 차단
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          if [ -z "$MA" ]; then echo "❌ MainActivity.java 못 찾음"; exit 1; fi
          PKG_LINE=$(grep -m1 '^package ' "$MA")
          echo "대상: $MA ($PKG_LINE)"
          cat > "$MA" << EOF
          ${PKG_LINE}

          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatDelegate;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              static {
                  // 클래스 로드 시점(액티비티 생성 전)에 앱 전체 라이트 고정
                  AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  AppCompatDelegate.setDefaultNightMode(AppCompatDelegate.MODE_NIGHT_NO);
                  super.onCreate(savedInstanceState);
                  try {
                      WebView wv = getBridge().getWebView();
                      WebSettings s = wv.getSettings();
                      // 글자 크기: 시스템 설정을 그대로 따른다(완전 추종). 넘치는 화면/모달은
                      // CSS에서 max-height + 스크롤로 처리하므로 잘리지 않는다.
                      if (Build.VERSION.SDK_INT >= 33) {
                          // Android 13+ : Algorithmic Darkening 차단
                          s.setAlgorithmicDarkeningAllowed(false);
                      } else if (Build.VERSION.SDK_INT >= 29) {
                          // Android 10~12 : Force Dark 차단
                          s.setForceDark(WebSettings.FORCE_DARK_OFF);
                      }
                  } catch (Throwable t) {
                      // WebView 미초기화 등 — 무시 (나이트모드 고정만으로도 대부분 차단됨)
                  }
              }
          }
          EOF
          echo "=== MainActivity.java (라이트 고정 적용) ==="
          cat "$MA"
      - name: FCM 알림 아이콘(상태바) 설정
        script: |
          set -e
          RES="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          mkdir -p "$RES/drawable"
          # 상태바용 흰색 실루엣 알림 아이콘 (벡터 드로어블 — 외부 도구 불필요)
          # ※ 상태바 아이콘은 흰색+투명이어야 정상. 컬러 런처 아이콘을 쓰면 흰 사각형으로 보임.
          cat > "$RES/drawable/ic_notification.xml" << 'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          XML
          # FCM 기본 알림 아이콘 메타데이터 주입 (없을 때만)
          if ! grep -q "com.google.firebase.messaging.default_notification_icon" "$MANIFEST"; then
            perl -0pi -e 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="\@drawable/ic_notification"/>\n    </application>#' "$MANIFEST"
            echo "✅ default_notification_icon 메타데이터 주입"
          else
            echo "default_notification_icon 이미 존재 — skip"
          fi
          echo "=== ic_notification.xml ==="
          cat "$RES/drawable/ic_notification.xml"
          echo "=== Manifest meta-data 확인 ==="
          grep -n "default_notification_icon" "$MANIFEST" || echo "(주입 실패)"
      - name: Generate app icon + splash (from assets/)
        script: |
          set +e
          echo "=== assets 폴더 확인 ==="
          ls -la assets/ 2>/dev/null || echo "❌ assets 폴더 없음!"
          echo "=== @capacitor/assets generate 실행 ==="
          npx --yes @capacitor/assets generate --android
          GEN_RESULT=$?
          echo "generate 종료코드: $GEN_RESULT"
          echo "=== 생성된 splash 리소스 확인 ==="
          find android/app/src/main/res -iname "*splash*" 2>/dev/null | head -20 || echo "splash 리소스 없음"
          echo "=== drawable 폴더의 splash 관련 ==="
          ls -la android/app/src/main/res/drawable*/ 2>/dev/null | grep -i splash || echo "drawable에 splash 없음"
          echo "=== values/styles.xml의 splash 테마 ==="
          grep -rn "splash\|Splash" android/app/src/main/res/values/styles.xml 2>/dev/null || echo "styles.xml에 splash 참조 없음"
          echo ""
          echo "=== [핵심 검증] 앱 아이콘(런처 아이콘) 정상 교체 확인 ==="
          ICXML="android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          if [ -f "$ICXML" ]; then
            AGE=$(find "$ICXML" -newer android/app/build.gradle 2>/dev/null)
            echo "--- ic_launcher.xml 내용 ---"
            cat "$ICXML"
            if [ -n "$AGE" ]; then
              echo "✅ ic_launcher.xml이 이번 빌드에서 새로 생성됨 (아이콘 교체 정상)"
            else
              echo "⚠️ ic_launcher.xml이 build.gradle보다 오래됨 — 기본 템플릿 아이콘 잔존 의심"
            fi
          else
            echo "❌ ic_launcher.xml 없음 — adaptive icon 생성 실패 (icon-foreground/background 누락 가능성)"
          fi
          echo "--- mipmap-xxhdpi 폴더 아이콘 파일 목록 (수정 시각 포함) ---"
          ls -la android/app/src/main/res/mipmap-xxhdpi/ 2>/dev/null || echo "mipmap-xxhdpi 없음"
      - name: Android 12+ splash logo fix (네이티브 스플래시 로고 잘림 방지)
        script: |
          set -e
          RES="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 1) 여백 큰 스플래시 로고 아이콘 배치 (repo: assets/splash_icon.png)
          if [ -f assets/splash_icon.png ]; then
            mkdir -p "$RES/drawable"
            cp assets/splash_icon.png "$RES/drawable/splash_icon.png"
            echo "splash_icon.png -> drawable 복사 완료"
          else
            echo "assets/splash_icon.png 없음! (빌드는 계속하지만 로고는 안 바뀜)"
          fi
          # 2) Android 12+ 네이티브 스플래시 테마 (values-v31) — Launch 테마만 재정의, 부모 상속
          mkdir -p "$RES/values-v31"
          cat > "$RES/values-v31/styles.xml" << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar.Launch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#F3E6CF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              </style>
          </resources>
          XML
          echo "values-v31/styles.xml 생성 완료"
          # 3) MainActivity가 Launch 테마를 쓰도록 보정 (.Launch가 아니면 .Launch로)
          perl -0pi -e 's#\@style/AppTheme\.NoActionBar(?!\.Launch)"#\@style/AppTheme.NoActionBar.Launch"#g' "$MANIFEST"
          echo "=== [디버그] values/styles.xml 전체 ==="
          cat "$RES/values/styles.xml" 2>/dev/null || echo "(values/styles.xml 없음)"
          echo "=== [디버그] values-v31/styles.xml ==="
          cat "$RES/values-v31/styles.xml"
          echo "=== [디버그] MainActivity 테마 라인 ==="
          grep -n "MainActivity\|android:theme" "$MANIFEST" | head -20 || true
          echo "=== [디버그] drawable/splash_icon 존재 확인 ==="
          ls -la "$RES/drawable/splash_icon.png" 2>/dev/null || echo "splash_icon 없음"
      - name: Decode keystore from base64
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/signing.keystore
          echo "keystore decoded"
      - name: Build signed AAB
        script: |
          set -e
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/signing.keystore \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
      - name: Verify AD_ID in merged manifest (없으면 빌드 실패)
        script: |
          set +e
          echo "=== 머지된 최종 Manifest에서 AD_ID 검증 ==="
          MERGED=$(find android/app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            MERGED=$(find android/app/build/intermediates -name "AndroidManifest.xml" -path "*release*" 2>/dev/null | head -1)
          fi
          echo "검사 대상: $MERGED"
          if [ -z "$MERGED" ]; then
            echo "❌ 머지된 Manifest를 찾지 못함 — 검증 불가, 빌드 실패 처리"
            find android/app/build/intermediates -name "AndroidManifest.xml" 2>/dev/null | head -10
            exit 1
          fi
          echo "--- uses-permission 전체 ---"
          grep -n "uses-permission" "$MERGED" || echo "(uses-permission 없음)"
          if grep -q "com.google.android.gms.permission.AD_ID" "$MERGED"; then
            echo "✅ AD_ID 권한이 최종 머지 Manifest에 포함됨 — 검증 통과"
          else
            echo "❌ AD_ID 권한이 최종 Manifest에 없음 — 이 aab는 Play Console 오류가 남. 빌드 실패 처리."
            exit 1
          fi
      - name: Check BILLING permission in merged manifest (정보성 — 빌드 실패 처리 안 함)
        script: |
          set +e
          echo "=== 머지된 최종 Manifest에서 BILLING 권한 확인 (Play Store 결제) ==="
          echo "참고: 최신 Play Billing Library는 이 권한 선언 없이도 동작하는 경우가 많음 — 없다고 반드시 결제 미동작을 의미하진 않음"
          MERGED=$(find android/app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            MERGED=$(find android/app/build/intermediates -name "AndroidManifest.xml" -path "*release*" 2>/dev/null | head -1)
          fi
          if grep -q "com.android.vending.BILLING" "$MERGED" 2>/dev/null; then
            echo "✅ BILLING 권한이 최종 머지 Manifest에 포함됨"
          else
            echo "ℹ️ BILLING 권한이 최종 Manifest에 없음 (정상일 수 있음 — Billing Library 최신 버전 참고)"
          fi
          echo "--- purchases-capacitor 관련 gradle 의존성 확인 ---"
          find android -name "*.gradle" -exec grep -l "revenuecat\|purchases" {} \; 2>/dev/null || echo "(revenuecat/purchases 관련 gradle 파일 없음)"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
